[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberbird"
version = "0.2.0"
description = "Vulnerability-patching agent implementations (COMSE6998-019)."
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "colorama",
    "langchain",
    "langchain-core",
    "langchain-ollama",
    "langchain-openrouter>=0.2.9",
    "langgraph",
    "llama-index-workflows>=2.24.1",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
cyberbird = "cyberbird.cli:cli"

[tool.setuptools.packages.find]
include = ["cyberbird*"]

[tool.setuptools.package-data]
"cyberbird.reactive.prompts" = ["*.md"]
"cyberbird.plan_and_validation.prompts" = ["*.md"]
"cyberbird.event_driven.prompts" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["cyberbird/tests"]
